<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Transactions</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let t of transactionservice.transactions" button (click)="viewDetail(t.id)">
      <ion-label>
        <h2>Transaction #{{t.id}}</h2>
        <p>{{t.date | date:'dd MMM yyyy, HH:mm'}}</p>
        <p>{{t.items.length}} item(s)</p>
      </ion-label>
      <ion-note slot="end">Rp. {{t.total}}</ion-note>
    </ion-item>
  </ion-list>

  <div class="ion-text-center ion-padding" *ngIf="transactionservice.transactions.length === 0">
    <p>No transactions yet. Add products to the cart, then confirm the transaction.</p>
    <ion-button routerLink="/tabs/products">Go to Products</ion-button>
  </div>
</ion-content>
