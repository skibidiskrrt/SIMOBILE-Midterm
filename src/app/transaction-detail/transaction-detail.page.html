<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/transactions"></ion-back-button>
    </ion-buttons>
    <ion-title>Transaction Detail</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="transaction">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Transaction #{{transaction.id}}</ion-card-title>
      <ion-card-subtitle>{{transaction.date | date:'dd MMM yyyy, HH:mm'}}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item *ngFor="let item of transaction.items">
          <ion-label>
            <h2>{{item.name}}</h2>
            <p>Rp. {{item.price}} x {{item.qty}}</p>
          </ion-label>
          <ion-note slot="end">Rp. {{item.subtotal}}</ion-note>
        </ion-item>
        <ion-item>
          <ion-label><h2>Total</h2></ion-label>
          <ion-note slot="end">Rp. {{transaction.total}}</ion-note>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
