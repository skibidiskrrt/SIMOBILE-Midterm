<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>product</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar [(ngModel)]="searchText" (ionInput)="searchProducts()" placeholder="Search Product"></ion-searchbar>
  <ion-list>
    <ion-item-sliding *ngFor="let product of filteredProducts">
      <ion-item>
        <ion-thumbnail slot="start">
          <img [src]="product.image || 'assets/icon/favicon.png'" [alt]="product.name">
        </ion-thumbnail>
        <ion-label> 
          <h2>{{product.name}}</h2>

          <p>Sell Price: Rp. {{product.sellingPrice}}</p>
          <p>Stock: {{product.stock}}</p>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="deleteProduct(product.id)">
          Delete
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>
</ion-content>
